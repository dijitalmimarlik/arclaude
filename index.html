<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Quest 3 AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
        /* Yükleme çubuğu tasarımı */
        .progress-bar {
            display: block;
            width: 50%;
            height: 10%;
            max-height: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
        }
        .update-bar {
            background-color: #4CAF50;
            width: 0%;
            height: 100%;
            border-radius: 25px;
            transition: width 0.3s;
        }
        .ar-button {
            background-color: #ffffff;
            border-radius: 8px;
            border: 2px solid #333;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

 <model-viewer src="model.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
    <button class="Hotspot" slot="hotspot-1" data-position="0.13353425062106944m 0.5541998423096544m 0.1739362092407289m" data-normal="-0.08660717581588048m 0.9962219800773927m -0.006400274046975447m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">Deri</div>
    </button><button class="Hotspot" slot="hotspot-2" data-position="0.8504222364860096m 0.0367719295294191m 0.43431708194088076m" data-normal="-0.3527698088517269m 0.6294415222341739m 0.6923560009491087m" data-visibility-attribute="visible">
        <div class="HotspotAnnotation">Metal</div>
    </button>
    <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
    </div>
    <button slot="ar-button" id="ar-button">
        Ar ile Gör
    </button>
    <div id="ar-prompt">
        <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
    </div>
</model-viewer>


</body>
</html>
