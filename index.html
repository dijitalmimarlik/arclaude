<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Quest 3 AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
        }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
        /* Yükleme çubuğu tasarımı */
        .progress-bar {
            display: block;
            width: 50%;
            height: 10%;
            max-height: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
        }
        .update-bar {
            background-color: #4CAF50;
            width: 0%;
            height: 100%;
            border-radius: 25px;
            transition: width 0.3s;
        }
        .ar-button {
            background-color: #ffffff;
            border-radius: 8px;
            border: 2px solid #333;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <model-viewer
        src="model.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y"
        ar-scale="auto"
        ar-placement="floor"
        shadow-intensity="1">
        
        <!-- Yükleme Çubuğu HTML Kısmı -->
        <div class="progress-bar" slot="progress-bar">
            <div class="update-bar"></div>
        </div>

        <button slot="ar-button" class="ar-button">
            AR ile Gerçek Dünyada Gör
        </button>
    </model-viewer>

</body>
</html>
