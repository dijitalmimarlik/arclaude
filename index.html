<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="chesterfield-sofa (1).glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
      <button class="Hotspot" slot="hotspot-1" data-position="0.13353425062106944m 0.5541998423096544m 0.1739362092407289m" data-normal="-0.08660717581588048m 0.9962219800773927m -0.006400274046975447m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Deri</div>
      </button><button class="Hotspot" slot="hotspot-2" data-position="0.8504222364860096m 0.0367719295294191m 0.43431708194088076m" data-normal="-0.3527698088517269m 0.6294415222341739m 0.6923560009491087m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Metal</div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
